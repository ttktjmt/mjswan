[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["src/mjswan/template/.nodeenv", "src/mjswan/template/node_modules", "**/__pycache__/**"]
# Client build is in the gitignore, but we still want it in the distribution.
ignore-vcs = true

[tool.hatch.version]
path = "src/mjswan/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
only-include = ["src/mjswan"]

[tool.hatch.build.targets.wheel]
packages = ["src/mjswan"]

[project]
name = "mjswan"
dynamic = ["version"]
authors = [
    {name = "mjswan Developers"},
]
description = "Browser-based MuJoCo simulation with real-time policy control"
readme = "README.md"
license = { text="Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Natural Language :: English",
]
# What turning a MuJoCo model into a browser app needs, whatever the assets came from.
# Each asset source is an extra below: `wandb`, `hf`, `mjlab`.
dependencies = [
    "mujoco==3.11.0",
    "nodeenv>=1.9.1",
    "onnx>=1.20.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# --- Sources, one per backend (ADR 0008). Each is imported inside a function, so
# `import mjswan` needs none of them.
wandb = [
    "wandb>=0.28.2",
]
hf = [
    "huggingface-hub>=1.32.0",
]
# The PT->ONNX conversion path: `add_scene_mjlab`, `add_policy_wandb`'s checkpoint
# branch, and term tracing.
mjlab = [
    "mjlab==1.6.0",
    "torch>=2.9.1",
]

# --- Tooling: only what `make check` runs. The ruff workflow installs this alone, so
# a source backend here would make the lint job download torch.
check = [
    # Pinned exactly, not floored. CI installs this fresh, so a floor resolves
    # to whatever ruff is newest that day — and a ruff release that stabilizes a
    # preview rule turns the lint job red with no change to this repo. That already
    # happened once: `PLR0917` (too many positional arguments) went stable in
    # 0.16.0 and failed a `__init__` that had passed for months. A lint version is
    # a tool, not a dependency; bump it deliberately.
    "ruff==0.16.0",
    # Pinned exactly for the same reason as ruff, and more so: ty is pre-1.0 and ships
    # weekly, so a floor would let a release change what `make type` reports with no
    # change to this repo. Bump it deliberately.
    "ty==0.0.77",
    "pyright>=1.1.407",
]

# What a contributor and the pytest workflow install: every source, or the tests that
# `importorskip` one silently skip.
dev = [
    "mjswan[check,wandb,hf,mjlab]",
    "pytest>=9.0.2",
    "pre-commit>=3.3.2",
]

# What `examples/` needs. `wandb` is for `examples/colab/anymal_c_velocity.ipynb`,
# which trains and reads back a run.
examples = [
    "mjswan[wandb,hf,mjlab]",
    "onnxruntime>=1.21.0",
]

[project.urls]
"GitHub" = "https://github.com/ttktjmt/mjswan"

[project.scripts]
mjswan = "mjswan.cli:app"

[tool.pyright]
extraPaths = []
# The package only: checking `examples/` means walking mjlab's and torch's dependency
# graph (minutes per run) for code that is not shipped. `**/.dep` keeps a repo an
# example clones at run time out of any glob.
include = ["src/mjswan"]
exclude = ["**/.dep", "**/node_modules", "**/dist", "./src/mjswan/template/.nodeenv", "./build"]
# `from torch import arange` and its siblings: torch's stubs re-export without `as`,
# so every such import reads as private. A packaging artifact of the dependency.
reportPrivateImportUsage = "none"

[tool.ty.environment]
# The hand-written mujoco stubs resolve types without being checked themselves: they are
# pyright-flavoured `.pyi` (`typing._CallableGenericAlias` and friends) that ty reads as
# errors when it owns them, but as a search path they are exactly what they are for.
extra-paths = ["typings"]

[tool.ty.src]
# The package, like pyright: `examples/` is written against third-party APIs and is not
# shipped, `typings/` is hand-written stubs whose pyright-only syntax ty reads as source,
# and `.dep/` is a repo an example clones at run time.
include = ["src/mjswan"]
exclude = ["typings", "**/.dep", "**/node_modules", "**/dist", "./src/mjswan/template/.nodeenv"]

[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors.
    "F",  # Pyflakes rules.
    "PLC",  # Pylint convention warnings.
    "PLE",  # Pylint errors.
    "PLR",  # Pylint refactor recommendations.
    "PLW",  # Pylint warnings.
    "I",  # Import sorting.
]
lint.ignore = [
    "E731",  # Do not assign a lambda expression, use a def.
    "E741",  # Ambiguous variable name. (l, O, or I)
    "E501",  # Line too long.
    "E721",  # Do not compare types, use `isinstance()`.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004",  # Magic value used in comparison.
    "PLR0915",  # Too many statements.
    "PLR0913",  # Too many arguments.
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC0415",  # Import should be at the top-level of a file.
    "PLC1901",  # Use falsey strings.
    "PLR5501",  # Use `elif` instead of `else if`.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLW0603",  # Global statement updates are discouraged.
    "PLW2901",  # For loop variable overwritten.
    "PLW0642",  # Reassigned self in instance method.
]
exclude = [
    ".nodeenv",
    "typings",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: triggers frontend build — exclude from pre-commit with -m 'not slow'",
    "mjlab: requires the examples extras (mjlab/torch/onnxruntime) and is skipped otherwise",
]
