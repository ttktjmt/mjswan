[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["src/mjswan/template/.nodeenv", "src/mjswan/template/node_modules", "**/__pycache__/**"]
# Client build is in the gitignore, but we still want it in the distribution.
ignore-vcs = true

[tool.hatch.version]
path = "src/mjswan/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
only-include = ["src/mjswan"]

[tool.hatch.build.targets.wheel]
packages = ["src/mjswan"]

[project]
name = "mjswan"
dynamic = ["version"]
authors = [
    {name = "mjswan Developers"},
]
description = "Browser-based MuJoCo simulation with real-time policy control"
readme = "README.md"
license = { text="Apache-2.0" }
# labmaze (transitive dep via myosuite -> dm-control) has no pre-built wheel for
# Python 3.13+, forcing a Bazel source build that fails with Bazel 8.x (WORKSPACE
# support removed). Pin to <3.13 until labmaze publishes a cp313 wheel.
# https://github.com/google-deepmind/dm_control/issues/511
requires-python = ">=3.10, <3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Natural Language :: English",
]
dependencies = [
    "mujoco==3.8.1",
    "nodeenv>=1.9.1",
    "onnx>=1.20.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "wandb>=0.23.1",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.407",
    "pre-commit>=3.3.2",
    # Pinned exactly, not floored. CI installs `.[dev]` fresh, so a floor resolves
    # to whatever ruff is newest that day — and a ruff release that stabilizes a
    # preview rule turns the lint job red with no change to this repo. That already
    # happened once: `PLR0917` (too many positional arguments) went stable in
    # 0.16.0 and failed a `__init__` that had passed for months. A lint version is
    # a tool, not a dependency; bump it deliberately.
    "ruff==0.16.0",
    # Pinned exactly for the same reason as ruff, and more so: ty is pre-1.0 and ships
    # weekly, so a floor would let a release change what `make type` reports with no
    # change to this repo. Bump it deliberately.
    "ty==0.0.77",
    "pytest>=9.0.2",
]
# Deliberately its own extra rather than part of `examples`: fetching a published
# policy from the Hub needs neither mjlab nor torch, and folding it into the heavy
# extra would hide that. `pip install mjswan[hf]` is the whole light path.
hf = [
    "huggingface-hub>=0.26.0",
]
examples = [
    "mjlab==1.5.3",
    "torch>=2.9.1",
    "onnxruntime>=1.21.0",
    "robot-descriptions>=1.22.0",
    "playground>=0.1.0",
    "myosuite",
    "gymnasium",
]

[project.urls]
"GitHub" = "https://github.com/ttktjmt/mjswan"

[project.scripts]
mjswan = "mjswan.cli:app"

[tool.pyright]
extraPaths = []
# The package. `examples/` is deliberately out: those scripts are written
# against third-party APIs (mjlab, myosuite, playground), and checking them meant walking
# every one of those dependency graphs — minutes per run — for diagnostics about code that
# is not shipped. `**/.dep` keeps a repo an example clones at run time out of any glob.
include = ["src/mjswan"]
exclude = ["**/.dep", "**/node_modules", "**/dist", "./src/mjswan/template/.nodeenv", "./build"]
# `from torch import arange` and its siblings: torch's stubs re-export without `as`,
# so every such import reads as private. A packaging artifact of the dependency.
reportPrivateImportUsage = "none"

[tool.ty.environment]
# The hand-written mujoco stubs resolve types without being checked themselves: they are
# pyright-flavoured `.pyi` (`typing._CallableGenericAlias` and friends) that ty reads as
# errors when it owns them, but as a search path they are exactly what they are for.
extra-paths = ["typings"]

[tool.ty.src]
# The package, like pyright: `examples/` is written against third-party APIs and is not
# shipped, `typings/` is hand-written stubs whose pyright-only syntax ty reads as source,
# and `.dep/` is a repo an example clones at run time.
include = ["src/mjswan"]
exclude = ["typings", "**/.dep", "**/node_modules", "**/dist", "./src/mjswan/template/.nodeenv"]

[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors.
    "F",  # Pyflakes rules.
    "PLC",  # Pylint convention warnings.
    "PLE",  # Pylint errors.
    "PLR",  # Pylint refactor recommendations.
    "PLW",  # Pylint warnings.
    "I",  # Import sorting.
]
lint.ignore = [
    "E731",  # Do not assign a lambda expression, use a def.
    "E741",  # Ambiguous variable name. (l, O, or I)
    "E501",  # Line too long.
    "E721",  # Do not compare types, use `isinstance()`.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004",  # Magic value used in comparison.
    "PLR0915",  # Too many statements.
    "PLR0913",  # Too many arguments.
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC0415",  # Import should be at the top-level of a file.
    "PLC1901",  # Use falsey strings.
    "PLR5501",  # Use `elif` instead of `else if`.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLW0603",  # Global statement updates are discouraged.
    "PLW2901",  # For loop variable overwritten.
    "PLW0642",  # Reassigned self in instance method.
]
exclude = [
    ".nodeenv",
    "typings",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "mujoco==3.10.0",
    "mujoco-mjx==3.10.0",
    "mujoco-warp>=3.10.0.3,<3.11",
    # h5py 3.7.0 has no pre-built wheel for Python 3.12 / macOS arm64.
    # Newer versions do, so override the version pinned by myosuite.
    "h5py>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: triggers frontend build — exclude from pre-commit with -m 'not slow'",
    "mjlab: requires the examples extras (mjlab/torch/onnxruntime) and is skipped otherwise",
]
