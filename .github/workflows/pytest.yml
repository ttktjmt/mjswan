name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install uv
          # `[dev]` brings mjlab, which requires torch. mjswan only ever calls
          # `torch.onnx.export` and `torch.load(map_location="cpu")`, so the CPU
          # wheel is enough, and the default Linux wheel is the CUDA build.
          uv pip install --system torch \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e ".[dev]"

      # Runs L1/L2 tests only.
      # @slow tests (builder.build) trigger a full npm/Node.js frontend build
      # and are not suitable for regular CI.
      # Integration tests (L4) are skipped automatically when demo assets are absent.
      - name: Test with pytest
        run: |
          pytest -m "not slow" --tb=short -q

  core:
    # `pip install mjswan` with no extra: it must import, build a model-only scene, and
    # answer each source's call with the extra to install. Only this job has nothing
    # missing to test, so the tests skip everywhere else, and MJSWAN_CORE_ONLY makes
    # them fail here rather than skip if an extra slips into the install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mjswan without extras
        run: |
          pip install uv
          uv pip install --system . pytest

      - name: Test the core install
        env:
          MJSWAN_CORE_ONLY: "1"
        run: |
          pytest tests/test_core_install.py --tb=short -q
