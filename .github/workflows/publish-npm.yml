name: publish-npm

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (tag or SHA)"
        required: true
        type: string
      version:
        description: "Version to publish (X.Y.Z or X.Y.Z-beta.N)"
        required: true
        type: string
      tag:
        description: "npm dist-tag (latest for stable, beta for prereleases)"
        required: false
        type: string
        default: latest

# Only `publish`, which runs no project code or dependency, holds the OIDC token npm
# trusts. npm's Trusted Publisher names this file and the `npm` environment.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Set from the input so a prerelease publishes its version even though the
      # tagged commit may not carry the bump (see release.yml). Vite reads _version.py.
      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/mjswan/_version.py
          cd src/mjswan/template
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' package-lock.json > package-lock.json.tmp
          mv package-lock.json.tmp package-lock.json

      - name: Setup Node.js for template build
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # No install scripts run (`.npmrc`).
      - name: Build web template
        working-directory: src/mjswan/template
        run: |
          npm ci
          npm run build

      - name: Pack
        working-directory: src/mjswan/template
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24' # Bundles npm >= 11.5.1, required by trusted publishing
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: npm/

      # `./`: npm reads `npm/<file>` as a GitHub repository. Auth via OIDC trusted publishing.
      - name: Publish to npm
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: npm publish "./npm/mjswan-${VERSION}.tgz" --access public --tag "$TAG"
