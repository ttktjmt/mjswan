name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/demo/main.py'
      - 'src/mjswan/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.9"
        checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5
        python-version: '3.12'

    # The `demo` extra alone: `examples` adds onnxruntime, which only the parity checks need.
    - name: Install Python dependencies
      run: uv sync --locked --extra demo

    - name: Build demo application
      run: |
        MJSWAN_BASE_PATH="/mjswan/" MJSWAN_NO_LAUNCH=1 uv run --locked python examples/demo/main.py
        echo "=== Dist size ==="
        du -h -d 1 examples/demo/dist 2>/dev/null | sort -rh | head -20

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: examples/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
