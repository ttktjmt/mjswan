name: publish-pypi

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (tag or SHA)"
        required: true
        type: string
      version:
        description: "Version to publish (X.Y.Z or X.Y.Z-beta.N)"
        required: true
        type: string

# Only `publish`, which runs no project code or dependency, holds the OIDC token PyPI
# trusts. PyPI's Trusted Publisher names this file and the `pypi` environment.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Set from the input so a prerelease publishes its version even though the
      # tagged commit may not carry the bump (see release.yml). PyPI accepts
      # prerelease versions; pip installs them only with --pre.
      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/mjswan/_version.py

      # No cache: a release builds from the lock alone.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Strip unsupported tags in README
        run: |
          sed -i '/<!-- pypi-strip -->/,/<!-- \/pypi-strip -->/d' README.md

      - name: Setup Node.js for template build
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # SPA only: publish-npm builds the library (`mjswan.js`), which no pip install loads.
      # No install scripts run (`.npmrc`).
      - name: Build web template
        working-directory: src/mjswan/template
        run: |
          npm ci
          npm run build:spa

      - name: Remove artifacts from pypi package
        working-directory: src/mjswan/template
        run: |
          rm -rf node_modules
          rm -rf .nodeenv

      # Lets `ClientBuilder.build()` reuse this dist/ for the default options, without Node.
      # Written on the tree as shipped, after the version is set: the marker hashes both.
      - name: Mark the prebuilt SPA as reusable
        run: |
          uv run --locked --python 3.12 python - <<'PY'
          import json
          from mjswan.build.frontend import TEMPLATE_DIR, ClientBuilder
          meta = ClientBuilder(TEMPLATE_DIR)._build_meta("/", None, False, False)
          (TEMPLATE_DIR / "dist" / ".mjswan-build-meta.json").write_text(json.dumps(meta))
          PY

      - name: Build the wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      # For the uv version `pyproject.toml` pins.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      # Auth via OIDC trusted publishing.
      - name: Publish to PyPI
        run: uv publish
