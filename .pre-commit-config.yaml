# A copy of mjswan Cloud's cutter test files: hashed byte for byte, so no hook touches them.
exclude: '^tests/blob_vectors/'

# Hooks run tools uv.lock or the template's package-lock.json pins (`make sync` first):
# a remote hook repo would pip-install its own requirements, unpinned.
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: .venv/bin/trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: .venv/bin/end-of-file-fixer
        language: system
        types: [text]

      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: '^typings/'

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: '^typings/'

      # .npmrc is committed, so a credential landing in it is a public leak.
      # Tokens belong in ~/.npmrc (where `npm login` puts them) or CI secrets.
      - id: npmrc-no-secrets
        name: no credentials in .npmrc
        language: pygrep
        entry: (?i)(_auth|_password|username|token)
        files: (^|/)\.npmrc$

      - id: pytest-fast
        name: pytest (L1/L2, no slow)
        entry: .venv/bin/pytest -m "not slow" --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  # You can disable this block if you don't edit JS/TS files.
  - repo: local
    hooks:
      # The template's locked eslint, never a registry install: run `npm ci` there first.
      - id: eslint
        name: eslint
        entry: >
          src/mjswan/template/node_modules/.bin/eslint
          --config src/mjswan/template/eslint.config.cjs
          --fix
        language: system
        files: ^src/mjswan/template/.*\.(js|jsx|ts|tsx)$
        exclude: ^src/mjswan/template/src/mujoco/.*\.d\.ts$
