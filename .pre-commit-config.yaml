default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the `ruff==` pin in pyproject's dev extra. Two different
    # ruff versions here and in CI means the hook can pass while CI fails.
    rev: v0.16.0
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
        exclude: '^typings/'
      # Run the formatter.
      - id: ruff-format
        exclude: '^typings/'

  - repo: local
    hooks:
      # .npmrc is committed, so a credential landing in it is a public leak.
      # Tokens belong in ~/.npmrc (where `npm login` puts them) or CI secrets.
      - id: npmrc-no-secrets
        name: no credentials in .npmrc
        language: pygrep
        entry: (?i)(_auth|_password|username|token)
        files: (^|/)\.npmrc$

      - id: pytest-fast
        name: pytest (L1/L2, no slow)
        entry: .venv/bin/pytest -m "not slow" --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  # You can disable this block if you don't edit JS/TS files.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: >
          npx eslint
          --config src/mjswan/template/eslint.config.cjs
          --fix
        language: node
        files: ^src/mjswan/template/.*\.(js|jsx|ts|tsx)$
        exclude: ^src/mjswan/template/src/mujoco/.*\.d\.ts$
